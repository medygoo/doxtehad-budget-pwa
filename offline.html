<!doctype html>
<html lang="fr" class="h-full bg-slate-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hors-ligne — Carnet de Budget DOXTEHAD</title>
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body class="h-full flex flex-col justify-center items-center p-6 text-center">
    <div class="max-w-md bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
      <div
        class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4"
      >
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-12.728 0m0 0l2.829-2.829m-2.829 2.829L3 21m2.829-5.657a5 5 0 010-7.072m0 0l2.829 2.829"
          />
        </svg>
      </div>
      <h1 class="text-xl font-bold text-slate-900 mb-2">Mode Hors-ligne</h1>
      <p class="text-xs text-slate-600 mb-6 leading-relaxed">
        Vous n'avez pas de connexion Internet. Vos données enregistrées restent accessibles
        localement dans votre Carnet de Budget.
      </p>
      <button
        onclick="window.location.href = './index.html'"
        class="w-full bg-navy-800 hover:bg-navy-900 text-white text-xs font-semibold py-2.5 rounded-lg transition"
      >
        Ouvrir mon Carnet de Budget
      </button>
      <button
        onclick="window.location.reload()"
        class="w-full mt-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium py-2 rounded-lg transition"
      >
        Réessayer la connexion
      </button>
    </div>
  </body>
</html>
